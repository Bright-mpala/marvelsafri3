{% extends "base.html" %}

{% block title %}Password Changed - Travel Booking{% endblock %}

{% block content %}
<section class="relative overflow-hidden py-12 md:py-16 px-4 sm:px-6 lg:px-8">
  <div class="absolute inset-0 -z-10 bg-gradient-to-br from-sky-50 via-white to-emerald-50"></div>
  <div class="max-w-3xl mx-auto">
    <div class="card card-body lg:p-10 text-center">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-green-100 text-green-700 rounded-full mx-auto mb-5">
        <i class="fa-solid fa-check text-2xl"></i>
      </div>
      <h1 class="font-display text-4xl font-bold text-gray-900">Password Changed</h1>
      <p class="text-gray-600 mt-3">Your account password has been updated successfully.</p>
      <div class="mt-7 flex flex-wrap justify-center gap-3">
        <a href="{% url 'accounts:dashboard' %}" class="btn btn-primary">Go to Dashboard</a>
        <a href="{% url 'accounts:profile' %}" class="btn btn-secondary">Account Profile</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
